name: Nanoconduction
description: 'Nanoconduction, Inc. was a Sunnyvale, California hardware startup that
  developed carbon-nanotube-based thermal management (chip-cooling) solutions for the
  microprocessor industry. The company licensed NASA Ames-developed Nano Engineered
  Thermal Material — vertically aligned carbon nanotube array composites that act as
  a high-efficiency thermal interface at the junction where processors meet heat sinks.
  Backed by Battery Ventures, Jerusalem Venture Partners, Phoenix Venture Partners,
  Western Technology Investment, and Woodside Fund (roughly $23M raised), Nanoconduction
  was acquired by Unidym in July 2008 and is permanently closed. It was surfaced as
  a Battery Ventures portfolio company and added to the API Evangelist network for
  enrichment; the enrichment pass found no public API, developer, or specification
  surface — a defunct materials-science hardware company with no digital API footprint.'
